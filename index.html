<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrandSentinal AI — Enterprise Governance Engine</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM UMD CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone to compile JSX in the browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #080B12;
      color: #f1f5f9;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>
</head>
<body class="bg-[#080B12] text-slate-100 min-h-screen">
  <div id="root"></div>

  <!-- React + JSX Logic -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- MOCK DATA ---
    const INITIAL_SUBMISSIONS = [
      {
        id: "SUB-8092",
        title: "Q4 QuantumCore Platform Launch Press Release",
        campaign: "Enterprise Q4 2026",
        contentType: "Press Release",
        author: "Rahul V.",
        role: "Content Lead",
        status: "Awaiting Human Approval",
        createdAt: "2026-10-24 09:15 AM",
        targetAudience: "Enterprise CTOs and System Architects",
        intendedPurpose: "Announce new 2x throughput benchmark while maintaining strict brand reliability standard.",
        desiredCTA: "Schedule a high-performance cluster trial today.",
        draftText: "BrandSentinal AI announces the breakthrough launch of QuantumCore 2.0. Operating guaranteed 2x faster than all industry competitors without exception, our proprietary neural engine delivers 100% defect-free brand governance. Tested across over 500 enterprise customers, QuantumCore provides total automated safety without requiring any human review.",
        findings: [
          {
            id: "FIND-101",
            layer: "Layer 4: Claim Verification",
            category: "Unsupported Superlative",
            severity: "Critical",
            citation: "Claims Ledger Entry #882 (Stale - Expired Oct 1, 2026)",
            explanation: "The claim 'guaranteed 2x faster than all industry competitors without exception' lacks active supporting evidence in the Claims Ledger. Supporting benchmark reference expired on October 1, 2026.",
            originalSnippet: "guaranteed 2x faster than all industry competitors without exception",
            suggestedFix: "delivers significantly enhanced throughput verified in internal benchmark tests",
            actionTaken: null
          },
          {
            id: "FIND-102",
            layer: "Layer 1: Rules Engine",
            category: "Policy Violation",
            severity: "Critical",
            citation: "Brand Guidelines v3.2 - Section 2.1 (Human Oversight Policy)",
            explanation: "Stating 'without requiring any human review' directly violates Mandatory Principle 5: 'AI automates analysis; an authorised human reviewer retains final approval.'",
            originalSnippet: "without requiring any human review",
            suggestedFix: "backed by automated AI scanning alongside final human review validation",
            actionTaken: null
          }
        ]
      },
      {
        id: "SUB-8093",
        title: "APAC Product Expansion Email Campaign",
        campaign: "Global Expansion",
        contentType: "Email Copy",
        author: "Ananya S.",
        role: "Marketing Manager",
        status: "Review Ready",
        createdAt: "2026-10-23 04:30 PM",
        targetAudience: "Regional Marketing Directors",
        intendedPurpose: "Introduce localized compliance templates.",
        desiredCTA: "Explore localized guidelines.",
        draftText: "Ensure your brand messages stay compliant with local regulation. BrandSentinal AI provides localized rule checking across all Asian markets.",
        findings: []
      }
    ];

    const INITIAL_CLAIMS = [
      { id: "CLAIM-REF-882", statement: "QuantumCore architecture processes natural language rules in under 12ms.", source: "Technical Benchmark Whitepaper v2.1", owner: "Engineering QA", status: "Stale", validFrom: "2026-01-01", validUntil: "2026-10-01" },
      { id: "CLAIM-REF-901", statement: "Reduces manual brand compliance review turnaround time by up to 60%.", source: "Q2 Enterprise Customer Survey", owner: "Product Marketing", status: "Supported", validFrom: "2026-06-01", validUntil: "2027-06-01" },
      { id: "CLAIM-REF-905", statement: "100% guaranteed zero human error in text auditing.", source: "Unverified Marketing Draft", owner: "External Agency", status: "Contradicted", validFrom: "2026-05-01", validUntil: "2026-09-01" }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState("landing");
      const [currentRole, setCurrentRole] = useState("Creator");
      const [submissions, setSubmissions] = useState(INITIAL_SUBMISSIONS);
      const [selectedSub, setSelectedSub] = useState(INITIAL_SUBMISSIONS[0]);
      const [claims, setClaims] = useState(INITIAL_CLAIMS);

      // New Submission Form
      const [newTitle, setNewTitle] = useState("");
      const [newCampaign, setNewCampaign] = useState("");
      const [newAudience, setNewAudience] = useState("");
      const [newPurpose, setNewPurpose] = useState("");
      const [newCTA, setNewCTA] = useState("");
      const [newText, setNewText] = useState("");

      const handleCreate = (e) => {
        e.preventDefault();
        const created = {
          id: `SUB-${Math.floor(1000 + Math.random() * 9000)}`,
          title: newTitle || "Untitled Campaign",
          campaign: newCampaign || "General",
          author: "Rahul V.",
          role: currentRole,
          status: "Review Ready",
          createdAt: new Date().toLocaleString(),
          targetAudience: newAudience || "General Audience",
          intendedPurpose: newPurpose || "Promotion",
          desiredCTA: newCTA || "Learn More",
          draftText: newText,
          findings: [
            {
              id: "FIND-201",
              layer: "Layer 4: Claim Verification",
              category: "Unsupported Claim",
              severity: "Critical",
              citation: "Claims Ledger Entry #905",
              explanation: "Automated scan detected unverified performance statements lacking active ledger validation.",
              originalSnippet: newText.slice(0, 40) + "...",
              suggestedFix: "verifiable benchmark data",
              actionTaken: null
            }
          ]
        };
        setSubmissions([created, ...submissions]);
        setSelectedSub(created);
        setActiveTab("workspace");
      };

      const handleApplyFix = (findingId, fixText) => {
        const updated = {
          ...selectedSub,
          draftText: selectedSub.draftText.replace(
            selectedSub.findings.find(f => f.id === findingId).originalSnippet,
            fixText
          ),
          findings: selectedSub.findings.map(f => f.id === findingId ? { ...f, actionTaken: "Applied" } : f)
        };
        setSelectedSub(updated);
        setSubmissions(submissions.map(s => s.id === updated.id ? updated : s));
      };

      const handleApprove = () => {
        const updated = { ...selectedSub, status: "Approved" };
        setSelectedSub(updated);
        setSubmissions(submissions.map(s => s.id === updated.id ? updated : s));
      };

      return (
        <div className="flex flex-col min-h-screen">
          <!-- HEADER -->
          <header className="sticky top-0 z-50 border-b border-slate-800 bg-[#080B12]/90 backdrop-blur px-6 py-3 flex items-center justify-between">
            <div className="flex items-center space-x-6">
              <div onClick={() => setActiveTab("landing")} className="cursor-pointer font-bold text-lg text-white flex items-center space-x-2">
                <span className="text-indigo-500">🛡️</span>
                <span>BrandSentinal <span className="text-xs font-mono bg-indigo-500/20 text-indigo-400 px-1.5 py-0.5 rounded border border-indigo-500/30">AI</span></span>
              </div>

              <nav className="hidden md:flex space-x-2 text-xs font-medium">
                {[
                  { id: "dashboard", label: "Dashboard" },
                  { id: "workspace", label: "Review Workspace" },
                  { id: "claims", label: "Claims Ledger" },
                  { id: "guidelines", label: "Guideline Ingestion" },
                  { id: "proof", label: "Proof & Architecture" }
                ].map((t) => (
                  <button
                    key={t.id}
                    onClick={() => setActiveTab(t.id)}
                    className={`px-3 py-1.5 rounded-lg transition-all ${activeTab === t.id ? "bg-indigo-600/20 text-indigo-300 border border-indigo-500/30" : "text-slate-400 hover:text-white"}`}
                  >
                    {t.label}
                  </button>
                ))}
              </nav>
            </div>

            <div className="flex items-center space-x-3">
              <div className="bg-slate-900 border border-slate-800 rounded-lg p-1 text-xs flex space-x-1">
                {["Creator", "Authorised Reviewer", "Admin"].map((r) => (
                  <button
                    key={r}
                    onClick={() => setCurrentRole(r)}
                    className={`px-2 py-0.5 rounded ${currentRole === r ? "bg-indigo-600 text-white" : "text-slate-400"}`}
                  >
                    {r}
                  </button>
                ))}
              </div>
              <button 
                onClick={() => setActiveTab("new")}
                className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition-all"
              >
                + New Submission
              </button>
            </div>
          </header>

          <!-- MAIN CONTAINER -->
          <main className="flex-1 max-w-7xl w-full mx-auto p-6">
            
            <!-- LANDING PAGE -->
            {activeTab === "landing" && (
              <div className="text-center py-16 space-y-6 max-w-3xl mx-auto">
                <div className="inline-block px-3 py-1 rounded-full border border-indigo-500/30 bg-indigo-500/10 text-indigo-300 text-xs font-mono">
                  Deterministic First • RAG Grounded • Human Approved
                </div>
                <h1 className="text-5xl font-extrabold text-white leading-tight">
                  Your Brand. Your Rules.<br />
                  <span className="bg-gradient-to-r from-indigo-400 via-blue-400 to-cyan-300 bg-clip-text text-transparent">
                    AI-Powered Governance Desk.
                  </span>
                </h1>
                <p className="text-slate-400">Flag It. Explain It. Cite It. Let a Person Decide.</p>
                <div className="flex justify-center space-x-4 pt-4">
                  <button onClick={() => setActiveTab("workspace")} className="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-6 py-3 rounded-xl">Open Review Desk</button>
                  <button onClick={() => setActiveTab("new")} className="bg-slate-900 border border-slate-700 text-slate-200 font-semibold px-6 py-3 rounded-xl">Try Demo</button>
                </div>
              </div>
            )}

            <!-- DASHBOARD -->
            {activeTab === "dashboard" && (
              <div className="space-y-6">
                <h2 className="text-xl font-bold text-white">Governance Dashboard</h2>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                    <span className="text-xs text-slate-400">Total Submissions</span>
                    <div className="text-2xl font-bold text-indigo-400">{submissions.length}</div>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                    <span className="text-xs text-slate-400">Awaiting Approval</span>
                    <div className="text-2xl font-bold text-amber-400">{submissions.filter(s => s.status.includes("Awaiting")).length}</div>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                    <span className="text-xs text-slate-400">Approved Releases</span>
                    <div className="text-2xl font-bold text-emerald-400">{submissions.filter(s => s.status === "Approved").length}</div>
                  </div>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-xl divide-y divide-slate-800">
                  {submissions.map(sub => (
                    <div key={sub.id} onClick={() => { setSelectedSub(sub); setActiveTab("workspace"); }} className="p-4 flex justify-between cursor-pointer hover:bg-slate-800/50">
                      <div>
                        <div className="font-semibold text-white text-sm">{sub.title}</div>
                        <div className="text-xs text-slate-400">{sub.id} • {sub.campaign} • By {sub.author}</div>
                      </div>
                      <span className={`text-xs px-2 py-1 rounded-full ${sub.status === "Approved" ? "bg-emerald-500/20 text-emerald-300" : "bg-amber-500/20 text-amber-300"}`}>{sub.status}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            <!-- REVIEW WORKSPACE -->
            {activeTab === "workspace" && selectedSub && (
              <div className="space-y-4">
                <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl flex justify-between items-center">
                  <div>
                    <h2 className="text-lg font-bold text-white">{selectedSub.title}</h2>
                    <p className="text-xs text-slate-400">{selectedSub.id} • Status: <span className="text-amber-400">{selectedSub.status}</span></p>
                  </div>
                  {currentRole === "Authorised Reviewer" && (
                    <button onClick={handleApprove} disabled={selectedSub.status === "Approved"} className="bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white text-xs font-semibold px-4 py-2 rounded-lg">
                      {selectedSub.status === "Approved" ? "Approved" : "Approve Content"}
                    </button>
                  )}
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
                  <!-- LEFT: INTENT -->
                  <div className="lg:col-span-3 bg-slate-900 border border-slate-800 p-4 rounded-xl space-y-3">
                    <h3 className="text-xs font-bold text-indigo-400 uppercase">Preserved Author Intent</h3>
                    <div className="text-xs space-y-2">
                      <div><span className="text-slate-500 block">Audience:</span><span className="text-slate-200">{selectedSub.targetAudience}</span></div>
                      <div><span className="text-slate-500 block">Purpose:</span><span className="text-slate-200">{selectedSub.intendedPurpose}</span></div>
                      <div><span className="text-slate-500 block">CTA:</span><span className="text-indigo-300 font-mono">{selectedSub.desiredCTA}</span></div>
                    </div>
                  </div>

                  <!-- CENTER: EDITOR -->
                  <div className="lg:col-span-5 bg-slate-900 border border-slate-800 p-4 rounded-xl">
                    <h3 className="text-xs font-bold text-slate-400 uppercase mb-2">Draft Content</h3>
                    <div className="bg-slate-950 p-4 rounded border border-slate-800 text-sm leading-relaxed min-h-[200px]">
                      {selectedSub.draftText}
                    </div>
                  </div>

                  <!-- RIGHT: FINDINGS -->
                  <div className="lg:col-span-4 space-y-3">
                    <h3 className="text-xs font-bold text-slate-400 uppercase">Governance Findings ({selectedSub.findings.length})</h3>
                    {selectedSub.findings.map(f => (
                      <div key={f.id} className="bg-slate-900 border border-slate-800 p-4 rounded-xl space-y-2">
                        <div className="flex justify-between text-xs">
                          <span className="font-bold text-rose-400">{f.category}</span>
                          <span className="bg-rose-500/20 text-rose-300 px-1.5 py-0.5 rounded font-mono text-[10px]">{f.severity}</span>
                        </div>
                        <p className="text-xs text-slate-300 bg-slate-950 p-2 rounded">{f.explanation}</p>
                        <div className="text-[10px] text-indigo-300 font-mono">Citation: {f.citation}</div>
                        <div className="bg-indigo-950/40 p-2 rounded border border-indigo-800/40 text-xs">
                          <span className="text-[10px] text-indigo-300 font-bold block">Fix Suggestion:</span>
                          <span className="text-emerald-300 font-mono">{f.suggestedFix}</span>
                          {f.actionTaken ? (
                            <div className="text-emerald-400 text-[10px] mt-1 font-semibold">Action: {f.actionTaken}</div>
                          ) : (
                            <button onClick={() => handleApplyFix(f.id, f.suggestedFix)} className="mt-2 bg-indigo-600 text-white text-[10px] px-2 py-1 rounded">Apply Suggestion</button>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            <!-- CLAIMS LEDGER -->
            {activeTab === "claims" && (
              <div className="space-y-4">
                <h2 className="text-xl font-bold text-white">Claims Ledger</h2>
                <div className="bg-slate-900 border border-slate-800 rounded-xl divide-y divide-slate-800">
                  {claims.map(c => (
                    <div key={c.id} className="p-4 flex justify-between items-center text-xs">
                      <div>
                        <div className="font-semibold text-white text-sm">{c.statement}</div>
                        <div className="text-slate-400">Source: {c.source} | Owner: {c.owner}</div>
                      </div>
                      <span className={`px-2 py-1 rounded ${c.status === "Supported" ? "bg-emerald-500/20 text-emerald-300" : "bg-amber-500/20 text-amber-300"}`}>{c.status}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            <!-- NEW SUBMISSION -->
            {activeTab === "new" && (
              <form onSubmit={handleCreate} className="max-w-xl mx-auto bg-slate-900 border border-slate-800 p-6 rounded-xl space-y-4 text-xs">
                <h2 className="text-lg font-bold text-white">New Submission</h2>
                <input type="text" placeholder="Title" required value={newTitle} onChange={e => setNewTitle(e.target.value)} className="w-full bg-slate-950 p-2.5 rounded border border-slate-800 text-white" />
                <input type="text" placeholder="Campaign" value={newCampaign} onChange={e => setNewCampaign(e.target.value)} className="w-full bg-slate-950 p-2.5 rounded border border-slate-800 text-white" />
                <textarea rows={4} placeholder="Paste draft content..." required value={newText} onChange={e => setNewText(e.target.value)} className="w-full bg-slate-950 p-2.5 rounded
